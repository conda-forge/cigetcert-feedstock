schema_version: 1

context:
  version: "1.19"

package:
  name: cigetcert
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cigetcert/cigetcert-${{ version }}.tar.gz
  sha256: db7c3226552d23516aa16a767dfce8031362640fc7a94d87a0a6e90d5c8afb36

build:
  number: 6
  script: ${{ PYTHON }} -m pip install . --no-build-isolation --no-deps -vv
  skip:
    - win

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - lxml
    - m2crypto
    - pyopenssl
    - if: win
      then: winkerberos
      else: pykerberos

tests:
  - package_contents:
      files:
        - if: unix
          then: share/man/man1/cigetcert.1
  - script:
      - cigetcert --listinstitutions
      - if: unix
        then: if command -v man; then man -P cat cigetcert; fi

about:
  summary: Get an X.509 certificate with SAML ECP and store proxies
  description: |
    cigetcert gets an X.509 certificate from a SAML 2.0 Service Provider
    (SP) such as CILogon using the Enhanced Client or Proxy (ECP)
    profile. Optionally it can also get a grid proxy certificate and/or
    transfer a grid proxy to MyProxy. It was developed for the Fermilab
    Distributed Computing Access with Federated Identities (DCAFI) project
    but is intended to be usable by other projects.
  homepage: https://cdcvs.fnal.gov/redmine/projects/fermitools/wiki/cigetcert
  repository: https://github.com/fermitools/cigetcert
  documentation: http://htmlpreview.github.io/?https://github.com/fermitools/cigetcert/blob/master/cigetcert.html
  license: BSD-3-Clause
  license_file: COPYING

extra:
  recipe-maintainers:
    - duncanmmacleod
